name: Native ports

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harmony-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HarmonyOS
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check appearance assets across native ports
        run: node ../scripts/check-appearance-assets.ts
      - name: Check HarmonyOS engine
        run: ./scripts/engine-check/run.sh

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test, lint and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v5
        with:
          name: android-debug
          path: |
            Android/app/build/outputs/apk/debug/*.apk
            Android/app/build/reports/tests/testDebugUnitTest/
            Android/app/build/reports/lint-results-debug.html
          if-no-files-found: error

  apple:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Apple Platform
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Check Apple engine
        run: ./Tools/engine-check/run.sh
      - name: Build macOS
        run: >-
          xcodebuild build -project ComplexSweeper-Apple.xcodeproj -scheme ComplexSweeper-Apple
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath .build/macos CODE_SIGNING_ALLOWED=NO
      - name: Build iOS Simulator
        run: >-
          xcodebuild build -project ComplexSweeper-Apple.xcodeproj -scheme ComplexSweeper-Apple
          -configuration Release -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/ios-simulator CODE_SIGNING_ALLOWED=NO
      - name: Package apps
        run: |
          mkdir -p .build/packages
          ditto -c -k --sequesterRsrc --keepParent '.build/macos/Build/Products/Release/复扫雷.app' .build/packages/ComplexSweeper-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent '.build/ios-simulator/Build/Products/Release-iphonesimulator/复扫雷.app' .build/packages/ComplexSweeper-iOS-simulator.zip
      - uses: actions/upload-artifact@v5
        with:
          name: apple-unsigned
          path: Apple Platform/.build/packages/*.zip
          if-no-files-found: error
